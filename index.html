  <!-- ヘッダー -->
  <header class="bg-white shadow-sm sticky top-0 z-10">
    <div class="max-w-md mx-auto px-4 py-4">
      <h1 class="text-xl font-bold text-center text-blue-600">Hakha Chin 学習帳</h1>
      
      <!-- コントロールバー -->
      <div class="flex justify-between items-center mt-4">
        <button id="btn-filter" onclick="toggleFilter()" class="flex items-center text-sm px-3 py-1 rounded-full border transition-colors bg-white border-gray-300 text-gray-600">
          <i class="ph ph-star mr-1"></i> ★のみ
        </button>
        
        <div class="flex space-x-2">
          <button id="btn-show-chin" onclick="toggleShow('chin')" class="flex items-center text-xs px-2 py-1 rounded transition-colors text-blue-500 bg-blue-50">
            <i class="ph ph-eye mr-1"></i> チン語
          </button>
          <button id="btn-show-phonetic" onclick="toggleShow('phonetic')" class="flex items-center text-xs px-2 py-1 rounded transition-colors bg-gray-200 text-gray-400">
            <i class="ph ph-eye-closed mr-1"></i> 音素
          </button>
          <button id="btn-show-jp" onclick="toggleShow('jp')" class="flex items-center text-xs px-2 py-1 rounded transition-colors text-blue-500 bg-blue-50">
            <i class="ph ph-eye mr-1"></i> 日本語
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- フレーズが並ぶリスト部分 -->
  <main id="phrase-list" class="max-w-md mx-auto p-4 space-y-3">
    <!-- ここにJavaScriptで自動的にデータが作られます -->
  </main>

  <!-- 下部固定のグローバルコントロール -->
  <div class="fixed bottom-0 w-full bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      
      <button onclick="cycleRepeat()" id="btn-repeat" class="flex flex-col items-center p-2 rounded-lg transition-colors text-gray-400 hover:bg-gray-50">
        <i id="icon-repeat" class="ph ph-repeat text-2xl"></i>
        <span id="text-repeat" class="text-[10px] mt-1 font-medium">リピートオフ</span>
      </button>

      <div class="flex-grow flex justify-center px-4 overflow-hidden">
        <div id="playing-status" class="text-center w-full">
          <p class="text-sm text-gray-400 mt-2">リストから選択して再生</p>
        </div>
      </div>

      <button class="flex flex-col items-center p-2 text-gray-400 hover:text-gray-600 rounded-lg hover:bg-gray-50" onclick="alert('音声を組み込み後に速度調整が可能です。')">
        <i class="ph ph-gauge text-2xl"></i>
        <span class="text-[10px] mt-1 font-medium">速度: 1.0x</span>
      </button>

    </div>
  </div>


  <!-- ========================================================== -->
  <!-- ⚙️ STEP 2: アプリを動かす裏側のプログラム（変更不要です） -->
  <!-- ========================================================== -->
  <script>
    // --- 1. データの自動変換 ---
    // エクセルのテキストデータを、プログラムで使える形式に変換します。
    const phrases = EXCEL_DATA.trim().split('\n')
      .filter(line => line.trim() !== '') // 空行を除外
      .map((line, index) => {
        const cols = line.split('\t'); // タブで区切る
        return {
          id: index + 1,
          chin: cols[0] ? cols[0].trim() : "",
          phonetic: cols[1] ? cols[1].trim() : "",
          jp: cols[2] ? cols[2].trim() : "",
          note: cols[3] ? cols[3].trim() : "",
          audioUrl: cols[4] ? cols[4].trim() : ""
        };
      });

    // --- 2. アプリの状態（設定）を管理 ---
    let state = {
      activeId: null,
      isPlaying: false,
      repeatMode: 0, // 0:なし, 1:全曲, 2:1曲
      showChin: true,
      showPhonetic: false,
      showJp: true,
      filterFavorites: false,
      // お気に入りはブラウザに保存されるようにします
      favorites: JSON.parse(localStorage.getItem('chin_favorites')) || [], 
      expandedNotes: []
    };

    let audio = null;
    let timerId = null;

    // --- 3. 画面を描画する関数 ---
    function render() {
      // 1. リストの描画
      const listContainer = document.getElementById('phrase-list');
      let html = '';
      
      const displayPhrases = state.filterFavorites 
        ? phrases.filter(p => state.favorites.includes(p.id)) 
        : phrases;

      if (displayPhrases.length === 0) {
        html = '<p class="text-center text-gray-500 mt-10">フレーズがありません。</p>';
      } else {
        displayPhrases.forEach(p => {
          const isActive = state.activeId === p.id;
          const isPlaying = isActive && state.isPlaying;
          const isFav = state.favorites.includes(p.id);
          const isNoteOpen = state.expandedNotes.includes(p.id);

          html += `
            <div class="flex flex-col p-4 rounded-xl shadow-sm transition-all duration-200 ${isActive ? 'bg-blue-50 border-2 border-blue-400 transform scale-[1.02]' : 'bg-white border border-gray-100'}">
              <div class="flex items-center">
                
                <!-- 再生ボタン -->
                <button onclick="togglePlay(${p.id})" class="flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center transition-colors ${isPlaying ? 'bg-blue-600 text-white shadow-md' : 'bg-gray-100 text-blue-600 hover:bg-gray-200'}">
                  <i class="ph ${isPlaying ? 'ph-pause-circle' : 'ph-play-circle'} text-3xl"></i>
                </button>

                <!-- テキスト -->
                <div class="ml-4 flex-grow overflow-hidden">
                  <p class="text-lg font-semibold transition-all duration-300 ${state.showChin ? 'opacity-100' : 'hidden'}">${p.chin}</p>
                  ${p.phonetic ? `<p class="text-sm text-teal-600 font-mono transition-all duration-300 ${state.showPhonetic ? 'opacity-100 mt-0.5' : 'hidden'}">[${p.phonetic}]</p>` : ''}
                  <p class="text-sm text-gray-500 transition-all duration-300 ${state.showJp ? 'opacity-100 mt-1' : 'hidden'}">${p.jp}</p>
                  
                  <!-- プログレスバー -->
                  ${isPlaying ? `
                    <div class="h-1 bg-blue-200 mt-2 rounded overflow-hidden">
                      <div class="h-full bg-blue-600 animate-progress"></div>
                    </div>
                  ` : ''}
                </div>

                <!-- アクションボタン -->
                <div class="flex flex-col space-y-1 ml-2">
                  <button onclick="toggleFavorite(${p.id})" class="p-2 transition-colors rounded-full ${isFav ? 'text-yellow-500 bg-yellow-50' : 'text-gray-400 hover:bg-gray-50'}">
                    <i class="ph ${isFav ? 'ph-star text-yellow-500 fill-current' : 'ph-star'} text-xl"></i>
                  </button>
                  ${p.note ? `
                    <button onclick="toggleNote(${p.id})" class="p-2 transition-colors rounded-full ${isNoteOpen ? 'text-blue-500 bg-blue-50' : 'text-gray-400 hover:text-blue-500 hover:bg-gray-50'}">
                      <i class="ph ph-article text-xl"></i>
                    </button>
                  ` : ''}
                </div>
              </div>

              <!-- メモ・解説エリア -->
              ${p.note && isNoteOpen ? `
                <div class="mt-3 pt-3 border-t border-blue-200/50 text-sm text-gray-700 bg-blue-50/50 p-3 rounded-lg flex items-start">
                  <i class="ph ph-article mr-2 text-blue-400 mt-0.5"></i>
                  <div>${p.note}</div>
                </div>
              ` : ''}
            </div>
          `;
        });
      }
      listContainer.innerHTML = html;

      // 2. ヘッダーボタンの更新
      updateHeaderButtons();
      // 3. フッターの更新
      updateFooter();
    }

    function updateHeaderButtons() {
      const btnFilter = document.getElementById('btn-filter');
      if(state.filterFavorites) {
        btnFilter.className = "flex items-center text-sm px-3 py-1 rounded-full border transition-colors bg-yellow-100 border-yellow-300 text-yellow-800";
        btnFilter.innerHTML = '<i class="ph ph-star mr-1 fill-current"></i> ★のみ';
      } else {
        btnFilter.className = "flex items-center text-sm px-3 py-1 rounded-full border transition-colors bg-white border-gray-300 text-gray-600";
        btnFilter.innerHTML = '<i class="ph ph-star mr-1"></i> ★のみ';
      }

      const updateBtn = (id, isShown, colorClass, iconOpen, iconClosed, text) => {
        const btn = document.getElementById(id);
        if(isShown) {
          btn.className = `flex items-center text-xs px-2 py-1 rounded transition-colors ${colorClass} bg-opacity-10`;
          btn.innerHTML = `<i class="ph ${iconOpen} mr-1"></i> ${text}`;
        } else {
          btn.className = "flex items-center text-xs px-2 py-1 rounded transition-colors bg-gray-200 text-gray-400";
          btn.innerHTML = `<i class="ph ${iconClosed} mr-1"></i> ${text}`;
        }
      };

      updateBtn('btn-show-chin', state.showChin, 'text-blue-600 bg-blue-100', 'ph-eye', 'ph-eye-closed', 'チン語');
      updateBtn('btn-show-phonetic', state.showPhonetic, 'text-teal-600 bg-teal-100', 'ph-eye', 'ph-eye-closed', '音素');
      updateBtn('btn-show-jp', state.showJp, 'text-blue-600 bg-blue-100', 'ph-eye', 'ph-eye-closed', '日本語');
    }

    function updateFooter() {
      const btnRepeat = document.getElementById('btn-repeat');
      const iconRepeat = document.getElementById('icon-repeat');
      const textRepeat = document.getElementById('text-repeat');
      const statusDiv = document.getElementById('playing-status');

      // リピートボタンの見た目
      if (state.repeatMode === 0) {
        btnRepeat.className = "flex flex-col items-center p-2 rounded-lg transition-colors text-gray-400 hover:bg-gray-50";
        iconRepeat.className = "ph ph-repeat text-2xl";
        textRepeat.innerText = "リピートオフ";
      } else if (state.repeatMode === 1) {
        btnRepeat.className = "flex flex-col items-center p-2 rounded-lg transition-colors text-blue-600 bg-blue-50";
        iconRepeat.className = "ph ph-repeat text-2xl";
        textRepeat.innerText = "全曲ループ";
      } else {
        btnRepeat.className = "flex flex-col items-center p-2 rounded-lg transition-colors text-blue-600 bg-blue-50";
        iconRepeat.className = "ph ph-repeat-once text-2xl";
        textRepeat.innerText = "1曲ループ";
      }

      // 再生ステータス
      if (state.activeId) {
        const activePhrase = phrases.find(p => p.id === state.activeId);
        statusDiv.innerHTML = `
          <p class="text-xs text-blue-500 font-bold mb-1">再生中...</p>
          <p class="text-sm font-medium truncate w-full px-2">${activePhrase.chin}</p>
        `;
      } else {
        statusDiv.innerHTML = '<p class="text-sm text-gray-400 mt-2">リストから選択して再生</p>';
      }
    }

    // --- 4. ユーザー操作時のアクション ---

    function togglePlay(id) {
      if (state.activeId === id && state.isPlaying) {
        // 停止処理
        if (timerId) clearTimeout(timerId);
        if (audio) { audio.pause(); audio.currentTime = 0; }
        state.isPlaying = false;
        state.activeId = null;
        render();
      } else {
        playAudio(id);
      }
    }

    function playAudio(id) {
      const phrase = phrases.find(p => p.id === id);
      if (!phrase) return;

      if (timerId) clearTimeout(timerId);
      
      state.activeId = id;
      state.isPlaying = true;
      render(); // 再生開始状態で描画

      // === 実際の音声を鳴らす処理 ===
      if (audio) { audio.pause(); }
      audio = new Audio("audio/" + phrase.audioUrl);
      audio.onended = () => handleAudioEnd(id);
      
      // 再生を実行（ファイルがないなどのエラー時はコンソールに記録して次へ）
      audio.play().catch(e => {
        console.error("音声の再生に失敗しました:", phrase.audioUrl, e);
        handleAudioEnd(id);
      });
    }

    function handleAudioEnd(currentId) {
      state.isPlaying = false;

      if (state.repeatMode === 2) {
        // 1曲ループ
        timerId = setTimeout(() => playAudio(currentId), 500);
      } else if (state.repeatMode === 1) {
        // 全曲ループ
        const displayPhrases = state.filterFavorites ? phrases.filter(p => state.favorites.includes(p.id)) : phrases;
        const currentIndex = displayPhrases.findIndex(p => p.id === currentId);
        if (currentIndex !== -1) {
          const nextIndex = (currentIndex + 1) % displayPhrases.length;
          const nextId = displayPhrases[nextIndex].id;
          timerId = setTimeout(() => playAudio(nextId), 800); // 0.8秒のポーズ
        }
      } else {
        state.activeId = null;
        render();
      }
    }

    function toggleFavorite(id) {
      if (state.favorites.includes(id)) {
        state.favorites = state.favorites.filter(favId => favId !== id);
      } else {
        state.favorites.push(id);
      }
      // ブラウザに保存する（次回開いた時も残る）
      localStorage.setItem('chin_favorites', JSON.stringify(state.favorites));
      render();
    }

    function toggleNote(id) {
      if (state.expandedNotes.includes(id)) {
        state.expandedNotes = state.expandedNotes.filter(noteId => noteId !== id);
      } else {
        state.expandedNotes.push(id);
      }
      render();
    }

    function toggleFilter() {
      state.filterFavorites = !state.filterFavorites;
      render();
    }

    function toggleShow(key) {
      if(key === 'chin') state.showChin = !state.showChin;
      if(key === 'phonetic') state.showPhonetic = !state.showPhonetic;
      if(key === 'jp') state.showJp = !state.showJp;
      render();
    }

    function cycleRepeat() {
      state.repeatMode = (state.repeatMode + 1) % 3;
      render();
    }

    // 初回起動時の描画
    window.onload = () => {
      render();
    };
  </script>
